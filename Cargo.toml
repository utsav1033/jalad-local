[package]
name = "tokenpati"
version = "0.2.0"
edition = "2021"
description = "kaun banega tokenpati: which local LLM will actually run on this machine"
license = "MIT"
repository = "https://github.com/utsav1033/jalad-local"
keywords = ["llm", "local", "inference", "quantization", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
figlet-rs = "0.1"
indicatif = "0.17"
unicode-width = "0.2"
terminal_size = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
