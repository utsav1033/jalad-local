name: test

on: [push, pull_request]

jobs:
  cargo:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo run --release -- --fast --json > /dev/null
      - run: cargo run --release -- --fast
        env:
          CLICOLOR_FORCE: "1"
